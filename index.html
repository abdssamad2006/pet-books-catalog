<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Netflix Account</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      text-align: center;
      max-width: 500px;
      background-color: #111;
      border-radius: 10px;
      padding: 2rem 1.5rem;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
    }

    .logo {
      width: 70px;
      margin-bottom: 1.5rem;
    }

    .container img.content-img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      color: #e50914;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background-color: #e50914;
      color: #fff;
      padding: 0.9rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #ff1e1e;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Netflix_icon.svg" alt="Netflix Logo" class="logo" />
    <img src="https://i.imgur.com/gFM6niD.jpeg" alt="Netflix Account Image" class="content-img" />
    <h1>Get Your Free Netflix Account</h1>
    <p>Access unlimited shows & movies. Only for a limited time.</p>
    <a href="https://bigappboi.com/cl/i/pod8gl" class="btn" target="_blank" rel="noopener">Get Now</a>
  </div>

</body>
</html>
