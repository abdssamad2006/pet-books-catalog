<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pet Care Books Catalog</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0; padding: 0;
    background: #f4f7fa;
    color: #333;
  }
  header {
    background: url('https://i.ibb.co/qMMXQHNx/file-000000004bb862438392003b1bcb7b46.png') no-repeat center/cover;
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-shadow: 0 0 10px rgba(0,0,0,0.7);
    font-size: 2.5rem;
    font-weight: bold;
  }
  main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 15px;
  }
  h1 {
    text-align: center;
    margin-bottom: 40px;
    font-size: 2rem;
    color: #222;
  }
  .books {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    justify-content: center;
  }
  .book-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    width: 280px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .book-card img {
    width: 100%;
    height: 360px;
    object-fit: cover;
  }
  .book-info {
    padding: 15px 20px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .book-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 15px;
  }
  .download-btn {
    text-align: center;
    margin-top: auto;
  }
  .download-btn a {
    display: inline-block;
    background: #2c7be5;
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }
  .download-btn a:hover {
    background: #1a5ccc;
  }
  footer {
    text-align: center;
    padding: 25px 0;
    color: #777;
    font-size: 0.9rem;
  }
  @media(max-width: 700px) {
    .books {
      flex-direction: column;
      align-items: center;
    }
    .book-card {
      width: 90%;
      height: auto;
    }
    .book-card img {
      height: auto;
    }
  }
</style>
</head>
<body>

<header>
  Pet Care Books Catalog
</header>

<main>
  <h1>Explore Our Top Pet Care Books</h1>
  <div class="books">

    <div class="book-card">
      <img src="https://i.ibb.co/4ZjKDWK1/8def6cb00f6afa40c4011407176308b36314f28ed01e48651b3f83d8c9de6bc8.jpg" alt="Cat Care Book Cover" />
      <div class="book-info">
        <div class="book-title">Ultimate Cat Care Guide</div>
        <div class="download-btn">
          <a href="https://locked2.com/cl/i/pod8gl" target="_blank" rel="noopener noreferrer">Download</a>
        </div>
      </div>
    </div>

    <div class="book-card">
      <img src="https://images-na.ssl-images-amazon.com/images/I/51FJjH47ZBL._SX398_BO1,204,203,200_.jpg" alt="Dog Owner's Home Veterinary Handbook" />
      <div class="book-info">
        <div class="book-title">Dog Owner's Home Veterinary Handbook</div>
        <div class="download-btn">
          <a href="https://locked1.com/cl/i/2ljvwd" target="_blank" rel="noopener noreferrer">Download</a>
        </div>
      </div>
    </div>

  </div>
</main>

<footer>
  &copy; 2025 Pet Care Books Catalog. All rights reserved.
</footer>

</body>
</html>
