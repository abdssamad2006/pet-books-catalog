<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pet Care Books Catalog</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #fff;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .hero {
      background-image: url('https://i.ibb.co/qMMXQHNx/file-000000004bb862438392003b1bcb7b46.png');
      background-size: cover;
      background-position: center;
      padding: 80px 20px;
      color: #fff;
    }
    .hero h1 {
      font-size: 36px;
      margin-bottom: 20px;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
    }
    .hero p {
      font-size: 18px;
      color: #eee;
      text-shadow: 0 0 3px rgba(0,0,0,0.6);
    }
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 30px 20px;
      max-width: 700px;
      margin: auto;
    }
    .book {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
    }
    .book img {
      width: 100%;
      border-radius: 5px;
    }
    .book-title {
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #222;
    }
    .download-btn {
      display: inline-block;
      margin: 30px auto 50px auto;
      padding: 15px 30px;
      background-color: #00AEEF;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 18px;
    }
    footer {
      margin: 30px 0;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Free Pet Care Books Catalog</h1>
    <p>Take the best care of your pet with our exclusive collection of guides & tips!</p>
  </div>

  <div class="catalog">
    <div class="book">
      <img src="https://i.ibb.co/4ZjKDWK1/8def6cb00f6afa40c4011407176308b36314f28ed01e48651b3f83d8c9de6bc8.jpg" alt="Book 1" />
      <div class="book-title">How to Understand Your Cat</div>
    </div>
  </div>

  <a class="download-btn" href="https://locked2.com/cl/i/pod8gl" target="_blank" rel="noopener noreferrer">Download the Catalog Free</a>

  <footer>
    Privacy Policy | Terms of Service | Contact Us
  </footer>

</body>
</html>
