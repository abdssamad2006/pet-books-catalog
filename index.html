<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Your Free Netflix Account</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      background-image: url('https://i.postimg.cc/7ZBcjDqp/netflix-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .landing-box {
      background: rgba(0, 0, 0, 0.85);
      padding: 3rem 2rem;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
    }

    .landing-box h1 {
      font-size: 2.2rem;
      color: #e50914;
      margin-bottom: 1rem;
    }

    .landing-box p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #ccc;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input[type="email"] {
      padding: 1rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      outline: none;
    }

    button {
      background: #e50914;
      color: #fff;
      padding: 1rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #ff1e22;
    }

    .note {
      font-size: 0.9rem;
      margin-top: 1.5rem;
      color: #888;
    }

    @media (max-width: 500px) {
      .landing-box h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="landing-box">
    <h1>Get Your Free Netflix Account</h1>
    <p>Unlimited movies, TV shows, and more. Watch anywhere. Cancel anytime.</p>
    <form class="form-group">
      <input type="email" placeholder="Enter your email" required />
      <button type="submit">Claim Now</button>
    </form>
    <p class="note">Limited time offer. No credit card required.</p>
  </div>

</body>
</html>
